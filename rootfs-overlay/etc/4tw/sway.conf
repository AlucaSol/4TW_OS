# Intentionally standalone: do not include Ubuntu's normal desktop bindings.
xwayland disable
default_border none
default_floating_border none
focus_follows_mouse no
mouse_warping none
output * bg /usr/share/plymouth/themes/4tw/4TW-OS.png fit #000000
input type:keyboard {
    xkb_layout us
    xkb_options srvrkeys:none
}
input type:touchpad {
    tap enabled
    natural_scroll enabled
}
for_window [app_id="firefox"] fullscreen enable
for_window [app_id="firefox"] inhibit_idle fullscreen

# --inhibited makes appliance controls work even with a browser key inhibitor.
bindsym --inhibited --no-repeat Ctrl+Mod1+b exec /usr/local/bin/4tw-battery
bindsym --inhibited Ctrl+Mod1+Left exec /usr/local/bin/4tw-brightness down
bindsym --inhibited Ctrl+Mod1+Right exec /usr/local/bin/4tw-brightness up
bindsym --inhibited --no-repeat Ctrl+Mod1+Delete exec /usr/bin/sudo -n /usr/local/sbin/4tw-poweroff

# No shell, launcher, Sway exit, workspace switching, or default config reload.
bindsym --inhibited Mod1+F4 nop
bindsym --inhibited Mod1+space nop
bindsym --inhibited Mod1+Home nop
bindsym --inhibited Ctrl+q nop
bindsym --inhibited Ctrl+w nop
bindsym --inhibited Ctrl+t nop
bindsym --inhibited Ctrl+n nop
bindsym --inhibited Ctrl+l nop
bindsym --inhibited Ctrl+o nop
bindsym --inhibited Ctrl+k nop
bindsym --inhibited Ctrl+j nop
bindsym --inhibited Ctrl+h nop
bindsym --inhibited Ctrl+s nop
bindsym --inhibited Ctrl+p nop
bindsym --inhibited Ctrl+Shift+a nop
bindsym --inhibited Ctrl+Shift+b nop
bindsym --inhibited Ctrl+Shift+c nop
bindsym --inhibited Ctrl+Shift+i nop
bindsym --inhibited Ctrl+Shift+j nop
