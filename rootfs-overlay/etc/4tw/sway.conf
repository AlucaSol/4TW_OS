bindsym --inhibited Ctrl+Shift+p nop
bindsym --inhibited Ctrl+Shift+q nop
bindsym --inhibited Ctrl+Shift+t nop
bindsym --inhibited Ctrl+Shift+w nop
bindsym --inhibited F1 nop
bindsym --inhibited F6 nop
bindsym --inhibited F10 nop
bindsym --inhibited F11 nop
bindsym --inhibited F12 nop
bindsym --inhibited Ctrl+Mod1+F1 nop
bindsym --inhibited Ctrl+Mod1+F2 nop
