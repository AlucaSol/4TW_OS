# Online mode: shared appliance shell plus browser-only restrictions.
include /etc/4tw/sway.conf
bindsym --inhibited --no-repeat Ctrl+Mod1+r exec /usr/local/libexec/4tw-return-home
bindsym --inhibited Ctrl+q nop
bindsym --inhibited Ctrl+w nop
bindsym --inhibited Ctrl+t nop
bindsym --inhibited Ctrl+n nop
bindsym --inhibited Ctrl+l nop
bindsym --inhibited Ctrl+o nop
bindsym --inhibited Ctrl+k nop
bindsym --inhibited Ctrl+j nop
bindsym --inhibited Ctrl+h nop
bindsym --inhibited Ctrl+s nop
bindsym --inhibited Ctrl+p nop
bindsym --inhibited Ctrl+Shift+a nop
bindsym --inhibited Ctrl+Shift+b nop
bindsym --inhibited Ctrl+Shift+c nop
bindsym --inhibited Ctrl+Shift+i nop
bindsym --inhibited Ctrl+Shift+j nop
bindsym --inhibited Ctrl+Shift+k nop
bindsym --inhibited Ctrl+Shift+n nop
bindsym --inhibited Ctrl+Shift+p nop
bindsym --inhibited Ctrl+Shift+q nop
bindsym --inhibited Ctrl+Shift+t nop
bindsym --inhibited Ctrl+Shift+w nop
exec /usr/local/libexec/4tw-online
